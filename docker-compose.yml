version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policyflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - policyflow
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: policyflow-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - policyflow
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: policyflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: policyflow
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: policyflow
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - policyflow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  policyflow:
    driver: bridge

volumes:
  dbdata:
    driver: local
